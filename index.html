<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  base-uri 'none';
  form-action 'none';
  frame-ancestors 'none';
">
<title>ya-plan</title>
<meta name="theme-color" content="#0b0d10">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100vh; background: #0b0d10; color: #e8eaed; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  h1 { color: #fff; font-size: 24px; font-weight: 600; margin-bottom: 6px; }
  .sub { color: #8a8f98; font-size: 13px; margin-bottom: 32px; font-family: ui-monospace, monospace; }
  .links { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
  a.app {
    display: block; padding: 16px 20px; background: #14171c;
    border: 1px solid #2a2e36; border-radius: 10px;
    color: #e8eaed; text-decoration: none; font-size: 15px; font-weight: 500;
    transition: border-color 0.15s, transform 0.15s;
  }
  a.app:hover { border-color: #81c784; transform: translateY(-1px); }
  a.app .emoji { margin-right: 8px; font-size: 18px; vertical-align: -2px; }
  a.app .desc { display: block; font-size: 11px; color: #8a8f98; font-family: ui-monospace, monospace; margin-top: 4px; font-weight: 400; }
  a.app.disabled { opacity: 0.45; pointer-events: none; }
  a.app.disabled .desc { color: #5a5f68; }
  .footer { margin-top: 32px; font: 11px ui-monospace, monospace; color: #5a5f68; }
  .footer a { color: #8a8f98; text-decoration: none; }
</style>
</head>
<body>
  <h1>ya-plan</h1>
  <div class="sub">monorepo · v2.0</div>
  <nav class="links">
    <a class="app" href="./console/">
      <span class="emoji">🛠</span>Console
      <span class="desc">Infrastructure ops · events, commits, telemetry, debug, health</span>
    </a>
    <a class="app disabled" href="./viewer/">
      <span class="emoji">📊</span>Viewer
      <span class="desc">Plan dashboard · pending AR-027 build</span>
    </a>
  </nav>
  <div class="footer">
    <a href="https://github.com/YoAm/ya-plan-console" target="_blank" rel="noopener">repo</a> ·
    <a href="./infra/">infra</a>
  </div>
</body>
</html>
